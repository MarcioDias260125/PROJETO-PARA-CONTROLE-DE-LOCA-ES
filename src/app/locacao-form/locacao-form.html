<div class="form-container">
  <h2>Cadastrar Nova Locação</h2>
  
  <form (ngSubmit)="salvar()">
    <div class="form-group">
      <label>Equipamento:</label>
      <input type="text" [(ngModel)]="novaLocacao.nomeEquipamento" name="equipamento" required>
    </div>

    <div class="form-group">
      <label>Nome da Obra:</label>
      <input type="text" [(ngModel)]="novaLocacao.nomeObra" name="obra" required>
    </div>

    <div class="form-group">
      <label>Responsável:</label>
      <input type="text" [(ngModel)]="novaLocacao.responsavelObra" name="responsavel" required>
    </div>

    <div class="form-group">
      <label>Telefone:</label>
      <input type="text" [(ngModel)]="novaLocacao.telefoneResponsavel" name="telefone" required>
    </div>

    <div class="form-group">
      <label>Data de Início:</label>
      <input type="date" [(ngModel)]="dataInicioStr" name="dataInicio" required>
    </div>

    <div class="form-group">
      <label>Data Fim (Previsão):</label>
      <input type="date" [(ngModel)]="dataFimStr" name="dataFim" required>
    </div>

    <button type="submit" class="btn-salvar">Salvar Locação</button>
    <a routerLink="/dashboard" class="btn-voltar">Voltar</a>
  </form>
</div>

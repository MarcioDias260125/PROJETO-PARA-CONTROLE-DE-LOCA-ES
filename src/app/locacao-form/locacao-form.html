<div class="form-container">
  <h2>Cadastrar Nova Locação</h2>
  
  <form (ngSubmit)="salvar()">
    
    <!-- CAMPO ALTERADO: Agora é um menu de seleção (dropdown) -->
    <div class="form-group">
      <label>Equipamento:</label>
      <select [(ngModel)]="novaLocacao.nomeEquipamento" name="equipamento" required>
        <option value="" disabled selected>Selecione o equipamento...</option>
        <option *ngFor="let eq of equipamentosDisponiveis" [value]="eq">
          {{ eq }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Nome da Obra / Local:</label>
      <input type="text" [(ngModel)]="novaLocacao.nomeObra" name="obra" required placeholder="Ex: Edifício Central">
    </div>

    <div class="form-group">
      <label>Responsável:</label>
      <input type="text" [(ngModel)]="novaLocacao.responsavelObra" name="responsavel" required placeholder="Nome do mestre/engenheiro">
    </div>

    <div class="form-group">
      <label>Telefone:</label>
      <input type="text" [(ngModel)]="novaLocacao.telefoneResponsavel" name="telefone" required placeholder="(79) 90000-0000">
    </div>

    <div class="form-group">
      <label>Data de Início:</label>
      <input type="date" [(ngModel)]="dataInicioStr" name="dataInicio" required>
    </div>

    <div class="form-group">
      <label>Data Fim (Previsão):</label>
      <input type="date" [(ngModel)]="dataFimStr" name="dataFim" required>
    </div>

    <button type="submit" class="btn-salvar">Salvar Locação</button>
    <a routerLink="/dashboard" class="btn-voltar">Voltar</a>
  </form>
</div>

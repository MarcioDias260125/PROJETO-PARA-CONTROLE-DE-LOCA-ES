<div class="container-fornecedores">
  <h2>Cadastro de Fornecedores 🛠️</h2>

  <!-- FORMULÁRIO DE CADASTRO -->
  <div class="card-cadastro">
    <form (submit)="cadastrar()">
      <div class="form-row">
        <div class="form-group flex-2">
          <label>Nome / Razão Social:*</label>
          <input type="text" [(ngModel)]="novoFornecedor.nomeEmpresa" name="nomeEmpresa" placeholder="Ex: Locadora Silva Equipamentos" required>
        </div>
        <div class="form-group flex-1">
          <label>CNPJ / CPF:</label>
          <input type="text" [(ngModel)]="novoFornecedor.cnpjOuCpf" name="cnpjOuCpf" placeholder="00.000.000/0000-00" maxlength="14" >
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label>Telefone:*</label>
          <input type="text" [(ngModel)]="novoFornecedor.telefone" name="telefone" placeholder="Ex: (79) 99999-9999" required>
        </div>
        <div class="form-group flex-1">
          <label>E-mail:</label>
          <input type="email" [(ngModel)]="novoFornecedor.email" name="email" placeholder="contato@empresa.com">
        </div>
        <div class="form-group flex-2">
          <label>Serviço / Peça Fornecida:</label>
          <input type="text" [(ngModel)]="novoFornecedor.servicoPrestado" name="servicoPrestado" placeholder="Ex: Manutenção de Andaimes">
        </div>
      </div>

      <button type="button" (click)="cadastrar()" class="btn-cadastrar">Cadastrar Fornecedor</button>
    </form>
  </div>

  <!-- LISTA DE FORNECEDORES -->
  <h3>Fornecedores Cadastrados</h3>
  
  <table class="tabela-fornecedores">
    <thead>
      <tr>
        <th>Empresa / Razão Social</th>
        <th>CNPJ / CPF</th>
        <th>Contato</th>
        <th>Serviço / Produto</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let f of listaFornecedores">
        <td><strong>{{ f.nomeEmpresa }}</strong></td>
        <td>{{ f.cnpjOuCpf || 'Não informado' }}</td>
        <td>
          📞 {{ f.telefone }}
          <br>
          <small *ngIf="f.email" style="color: #666;">✉️ {{ f.email }}</small>
        </td>
        <td><span class="tag-servico">{{ f.servicoPrestado || 'Geral' }}</span></td>
        <td>
          <button (click)="excluir(f.id, f.nomeEmpresa)" class="btn-excluir">Remover</button>
        </td>
      </tr>
      <tr *ngIf="listaFornecedores.length === 0">
        <td colspan="5" style="text-align: center;">Nenhum fornecedor cadastrado.</td>
      </tr>
    </tbody>
  </table>
</div>
